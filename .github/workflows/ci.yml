name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active LTS lines. The packages declare "node": ">=16" but are only tested on maintained releases.
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check all-in-one dependencies
        run: npm run check-all-in-one-deps

      - name: Run workspace tests
        run: npm test

      - name: Run coverage
        run: npm run coverage

      - name: Build workspaces
        run: npm run build

      - name: Check generated API docs are up to date
        run: npm run docs:api:check

      - name: Validate package tarballs
        run: npm run pack:all
