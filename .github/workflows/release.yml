name: Release

# Runs on every push to main. changesets/action decides what to do:
#   - If changesets are pending, it opens/updates a "Version Packages" PR.
#   - Once that PR is merged (no changesets left, versions bumped), it publishes
#     the changed packages to npm via OIDC Trusted Publishing (no NPM_TOKEN needed).
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Check all-in-one dependencies
        run: npm run check-all-in-one-deps

      - name: Run workspace tests
        run: npm test

      - name: Build workspaces
        run: npm run build

      - name: Version or publish packages
        uses: changesets/action@v2
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
